name: Build and Publish Whatacall APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Whatacall Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Materialize Firebase google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf "%s\n" "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::error::Missing app/google-services.json! Add GitHub Repository Secret GOOGLE_SERVICES_JSON and re-run."
              exit 1
            fi
          fi

      - name: Materialize debug keystore matching Firebase SHA-1
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf "%s" "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > debug.keystore
            echo "Decoded debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating temporary debug.keystore (register its SHA-1 in Firebase for Google Sign-In)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses and install SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Write optional TURN configuration from GitHub Secrets
        env:
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          if [ -n "$TURN_SERVER_URL" ]; then
            {
              echo "TURN_SERVER_URL=$TURN_SERVER_URL"
              echo "TURN_USERNAME=${TURN_USERNAME:-UNCONFIGURED_TURN_USERNAME}"
              echo "TURN_CREDENTIAL=${TURN_CREDENTIAL:-UNCONFIGURED_TURN_CREDENTIAL}"
            } > .env
          fi

      - name: Build Whatacall APK
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Package APK for public distribution
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Whatacall.apk
          ls -lh Whatacall.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whatacall-APK
          path: Whatacall.apk
          retention-days: 30

      - name: Publish public GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Whatacall Android APK
          body: |
            Public Android APK build for **Whatacall** (*Your World, One Call Away*).

            ### Download & Install
            1. Download **Whatacall.apk** from the Assets section below.
            2. Open the downloaded file on your Android device and allow **Install unknown apps** if prompted.

            > Signed with the project's registered Firebase SHA-1 certificate (`com.aistudio.whatacall.k8m4px`).
          files: Whatacall.apk
          make_latest: true
          prerelease: false
