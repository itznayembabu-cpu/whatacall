name: Build and Publish Whatacall APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Whatacall Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Materialize debug keystore matching Firebase SHA-1
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Write optional TURN configuration from GitHub Secrets
        env:
          TURN_SERVER_URL: ${{ secrets.TURN_SERVER_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          if [ -n "$TURN_SERVER_URL" ]; then
            {
              echo "TURN_SERVER_URL=$TURN_SERVER_URL"
              echo "TURN_USERNAME=${TURN_USERNAME:-UNCONFIGURED_TURN_USERNAME}"
              echo "TURN_CREDENTIAL=${TURN_CREDENTIAL:-UNCONFIGURED_TURN_CREDENTIAL}"
            } > .env
          fi

      - name: Build Whatacall APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for public distribution
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Whatacall.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whatacall-APK
          path: Whatacall.apk
          retention-days: 30

      - name: Publish public GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Whatacall Android APK (${{ github.sha }})
          body: |
            Public Android APK build for **Whatacall** (*Your World, One Call Away*).

            ### Download & Install
            1. Download **Whatacall.apk** from the Assets section below.
            2. On your Android phone, open the downloaded file and allow **Install unknown apps** if prompted.

            > Make sure Firebase Phone Authentication and Storage are enabled in your Firebase project (`gen-lang-client-0671277430`) as described in `BACKEND_AND_DEPLOYMENT.md`.
          files: Whatacall.apk
          make_latest: true
          prerelease: false
